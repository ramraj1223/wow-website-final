  <script>

    // ============================================================
    // BEFORE/AFTER SLIDERS — drag (mouse/touch) or use the hidden range
    // input (keyboard/a11y) to reveal more of the before or after photo.
    // ============================================================
    document.querySelectorAll('.ba-slider').forEach((slider) => {
      const before  = slider.querySelector('.ba-img-before');
      const divider = slider.querySelector('.ba-divider');
      const handle  = slider.querySelector('.ba-handle');
      const range   = slider.querySelector('.ba-range-sr');

      function setPct(pct) {
        pct = Math.min(100, Math.max(0, pct));
        before.style.clipPath = `inset(0 ${100 - pct}% 0 0)`;
        divider.style.left = pct + '%';
        handle.style.left = pct + '%';
        range.value = pct;
      }

      function pctFromClientX(clientX) {
        const rect = slider.getBoundingClientRect();
        return ((clientX - rect.left) / rect.width) * 100;
      }

      let dragging = false;
      slider.addEventListener('pointerdown', (e) => {
        dragging = true;
        setPct(pctFromClientX(e.clientX));
      });
      window.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        setPct(pctFromClientX(e.clientX));
      });
      window.addEventListener('pointerup', () => { dragging = false; });

      range.addEventListener('input', () => setPct(Number(range.value)));

      setPct(50);
    });
  </script>
